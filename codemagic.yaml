# Build cloud + publication TestFlight pour MonAssiette.
# Aucun Mac requis : Codemagic compile et signe sur un Mac cloud, puis pousse sur TestFlight.
#
# Prérequis à configurer UNE FOIS dans l'interface web Codemagic (voir docs/DEPLOIEMENT-TESTFLIGHT.md) :
#   1. Une intégration "App Store Connect API key" nommée exactement "AppStoreConnect"
#      (Codemagic > Teams/User settings > Integrations > App Store Connect).
#   2. Rien d'autre : la signature (certificats + profils) est gérée automatiquement.

workflows:
  ios-testflight:
    name: MonAssiette – iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect   # <-- nom de la clé API créée dans Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.henault.monassiette
      vars:
        BUNDLE_ID: "com.henault.monassiette"
        XCODE_PROJECT: "MonAssiette.xcodeproj"
        XCODE_SCHEME: "MonAssiette"
      xcode: latest
    scripts:
      - name: Récupérer / créer les fichiers de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Installer les certificats dans le trousseau
        script: |
          keychain initialize
          keychain add-certificates
      - name: Appliquer les profils de provisioning
        script: |
          xcode-project use-profiles
      - name: Numéro de build unique et croissant
        script: |
          agvtool new-version -all "$(($BUILD_NUMBER + 1))"
      - name: Compiler l'IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Pour partager à la famille via un lien/QR public, décommentez et créez
        # d'abord le groupe "Famille" dans TestFlight :
        # beta_groups:
        #   - Famille
      email:
        recipients:
          - votre-email@example.com   # <-- remplacez par votre e-mail (non commité en clair)
        notify:
          success: true
          failure: true
